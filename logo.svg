<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" role="img" aria-label="MediChain">
  <defs>
    <linearGradient id="medichain-gradient" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0284c7"/>
      <stop offset="1" stop-color="#0d9488"/>
    </linearGradient>
  </defs>
  <!-- rounded tile in the site's blue-to-teal gradient -->
  <rect width="48" height="48" rx="12" fill="url(#medichain-gradient)"/>
  <!-- hexagon = a block in the chain -->
  <path d="M24 10.5 35.7 17.25v13.5L24 37.5 12.3 30.75v-13.5Z" fill="#ffffff" stroke="#ffffff" stroke-width="4" stroke-linejoin="round"/>
  <!-- medical cross, cut out of the block -->
  <rect x="21" y="15.5" width="6" height="17" rx="1.75" fill="url(#medichain-gradient)"/>
  <rect x="15.5" y="21" width="17" height="6" rx="1.75" fill="url(#medichain-gradient)"/>
</svg>
